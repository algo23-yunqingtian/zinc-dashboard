# 锌(Zn)看板 AI 解盘评分配置
# 复刻自 nickel_scoring.yaml（结构完全一致），按锌产业链重构：
#   核心矛盾 = 矿端紧缺(锌精矿TC) ↔ 冶炼产能/利润博弈，需求端由镀锌(地产/基建)主导
# 数据键名已锌化（B9_galvanizing=镀锌/合金, B14_premium=广东升贴水, B6_zinc_concentrate_tc=锌精矿TC, A2.import_ratio=进口占比），
# 其承载的已是锌数据（详见 docs/zinc_frame.md 第3节"键名映射"）。
symbol: Zn
symbol_cn: 锌
category: 有色金属
version: "2.0.0"   # v2.0 = 首次从镍框架复刻为锌框架 (2026-08-17)

# ============================================================
# 一、核心瓶颈（锌特有）
# ============================================================
bottleneck:
  summary: 锌的核心矛盾在"矿端紧缺（锌精矿TC）"与"冶炼产能/利润"的博弈，需求端由镀锌（地产后周期/基建）主导
  supply_side: 锌精矿供应紧张度（锌精矿TC、矿山扰动、对进口矿依赖度）
  demand_side: 镀锌板（地产/基建）需求、压铸锌合金、氧化锌
  price_driver: 矿端紧缺 → TC下行 → 冶炼利润压缩 → 被动减产 → 供给收缩；镀锌需求决定消费弹性
  note: 锌的矿端集中度高于镍，嘉能可/泰克/伦丁等巨头减产对TC与价格扰动显著

# ============================================================
# 二、核心指标（看板18图 → 锌语义）
# ============================================================
core_indicators:
  mine_supply:   [锌精矿TC(美元/干吨), 锌精矿进口量, 矿山开工率, 矿端扰动事件]
  smelter:       [冶炼厂利润(元/吨), 冶炼开工率, 检修/减停产]
  demand:        [镀锌板产量(万吨), 压铸锌合金开工率, 表观消费]
  inventory:     [SHFE库存, LME库存(注册/注销), 七地社会库存]
  spread:        [广东0#锌锭升贴水, 沪伦比/进口窗口]
  macro:         [美元指数, 有色板块资金流]

# ============================================================
# 三、8大核心矛盾（替代镍版 contradictions）
#    每条: weight(权重) + bullish/bearish 信号 + news_keywords
# ============================================================
contradictions:
  - id: mine_supply_tight
    name: "矿端紧缺（锌精矿TC）"
    weight: 5
    bullish:  [锌精矿TC下行, 海外矿山减产, 矿端扰动/罢工, 进口矿到港减少]
    bearish:  [锌精矿TC上行, 新建矿山投产, 进口矿放量]
    news_keywords: [锌精矿, 锌矿, TC, 加工费, 嘉能可, 泰克, 伦丁, 秘鲁, 玻利维亚, 矿山减产, 矿端扰动]
    # 数据代理方向：锌精矿TC 趋势下行=矿紧=利多锌价
    signal: {series: tc, trend: down, direction: 1}

  - id: tc_rc_trend
    name: "TC/RC 加工费趋势"
    weight: 5
    bullish:  [TC长单下调, 加工费创历史低位, 矿紧料紧]
    bearish:  [TC长单上调, 加工费回升, 矿松料松]
    news_keywords: [长单TC, 加工费谈判, benchmark TC, 锌精矿基准]
    # 数据代理方向：TC 趋势下行=加工费走低=矿紧利多
    signal: {series: tc, trend: down, direction: 1}

  - id: smelter_margin
    name: "冶炼利润与开工"
    weight: 4
    bullish:  [冶炼利润修复, 检修后复产, 被动减产结束]
    bearish:  [冶炼利润转亏, 检修/被动减产扩大, 开工率下行]
    news_keywords: [冶炼利润, 冶炼厂检修, 减产, 开工率, 株冶, 中金岭南, 驰宏锌锗, 豫光金铅]
    # 数据代理方向：冶炼利润 趋势下行=利润压缩=利空
    signal: {series: smelt_profit, trend: down, direction: -1}

  - id: galvanizing_demand
    name: "镀锌需求（地产/基建）"
    weight: 4
    bullish:  [镀锌板产量回升, 基建/地产政策刺激, 镀锌开工提升]
    bearish:  [镀锌板减产, 地产新开工走弱, 镀锌需求疲软]
    news_keywords: [镀锌, 镀锌板, 地产, 基建, 压铸锌合金, 氧化锌, 新开工, 稳增长]
    # 数据代理方向：镀锌产量 趋势下行=需求弱=利空
    signal: {series: galvanized_prod, trend: down, direction: -1}

  - id: inventory_draw
    name: "七地库存去化"
    weight: 5
    bullish:  [七地库存去化, LME注销仓单上升, 低库存+back结构]
    bearish:  [七地库存累库, LME注册仓单增加, 高库存压力]
    news_keywords: [七地库存, 社会库存, LME库存, 注销仓单, 注册仓单, 低库存]
    # 数据代理方向：七地库存 趋势下行=去化=利多
    signal: {series: inv_18, trend: down, direction: 1}

  - id: import_window
    name: "进口窗口（沪伦比）"
    weight: 3
    bullish:  [沪伦比修复, 进口盈利, 比价走强]
    bearish:  [沪伦比走低, 进口亏损, 比价走弱]
    news_keywords: [沪伦比, 进口盈亏, 比价, 人民币, 进口锌]
    # 数据代理方向：沪伦比 趋势下行=进口亏损=利空
    signal: {series: shfe_lme_ratio, trend: down, direction: -1}

  - id: macro_liquidity
    name: "宏观流动性"
    weight: 3
    bullish:  [降息/宽松, 美元走弱, 有色板块资金流入]
    bearish:  [加息/紧缩, 美元走强, 风险偏好下降]
    news_keywords: [美联储, 降息, 美元指数, 流动性, 有色板块, 资金流]
    # 宏观无单指标代理，方向仍依赖新闻措辞

  - id: policy_event
    name: "政策 / 环保限产"
    weight: 3
    bullish:  [环保限产, 能耗双控, 供给侧约束]
    bearish:  [政策打压, 抛储, 产能放开]
    news_keywords: [环保, 限产, 能耗双控, 抛储, 供给侧, 碳中和]
    # 政策事件型，方向仍依赖新闻措辞

  - id: lme_squeeze
    name: "LME结构性挤仓"
    weight: 5
    bullish:  [注销仓单占比飙升, LME back结构加深, 现货升水走阔, 仓单集中度异常]
    bearish:  [注销仓单回落, contango结构, 挤仓解除]
    news_keywords: [LME挤仓, 注销仓单, back结构, 现货升水, 仓单集中度, 挤仓, LME逼仓]
    # 数据代理方向：LME注销仓单 趋势上行=挤仓=利多
    signal: {series: lme_canc, trend: up, direction: 1}

# ============================================================
# 四、相关性闸门（与镍版一致：命中品种核心词 或 "限定词+锌产业词"组合）
# ============================================================
relevance:
  core_terms:
    - 锌
    - 锌精矿
    - 锌矿
    - 锌锭
    - 锌合金
    - 镀锌
    - 镀锌板
    - 压铸锌合金
    - 氧化锌
    - TC
    - 加工费
    - 株冶
    - 中金岭南
    - 驰宏锌锗
    - 宏达
    - 罗平锌电
    - 锌业股份
    - 白银有色
    - 豫光金铅
    - Glencore
    - 嘉能可
    - Teck
    - 泰克
    - 伦丁
    - Lundin
    - Nyrstar
    - Boliden
    - 秘鲁
    - 玻利维亚
    - 澳大利亚
    - 锌矿
    - LME锌
    - SHFE锌
    - 七地库存
    - 广东0#锌
  # 限定词组合（如"检修"+"锌"才算锌相关）
  combos:
    - [检修, 锌]
    - [减产, 锌]
    - [库存, 锌]
    - [限产, 锌]
    - [TC, 锌]
  # 跨品种对比中允许的对照词（锌 vs 这些品种做相对强弱）
  cross_terms: [铜, 铝, 铅, 镍, 锡, 有色]

# ============================================================
# 五、新闻分级（A/B/C 三级，复刻镍版结构）
# ============================================================
tiers:
  # A级：直接定价、高确定性
  A:
    name: "直接定价 / 高确定性"
    keywords:
      - 嘉能可
      - 泰克
      - 伦丁
      - 秘鲁
      - 玻利维亚
      - 锌精矿TC
      - 锌精矿基准
      - 长单TC
      - 矿山减产
      - 矿端扰动
      - 冶炼厂检修
      - 冶炼利润转亏
      - 被迫减产
      - 镀锌板排产
      - 七地库存
      - 社会库存大幅下降
      - 环保限产
      - 能耗双控
      - 广东0#锌升贴水
    weight: 3.0
  # B级：间接受影响 / 情绪驱动
  B:
    name: "间接受影响 / 情绪"
    keywords:
      - 基建
      - 地产政策
      - 稳增长
      - 降息
      - 美元指数
      - LME注销仓单
      - 沪伦比
      - 进口盈亏
      - 表观消费
      - 压铸锌合金开工
      - 氧化锌
      - 库存季节性
      - 技术突破
    weight: 1.5
  # C级：噪音 / 弱相关
  C:
    name: "噪音 / 弱相关"
    keywords:
      - 纯商品普涨
      - 地缘(非矿端)
      - 个股异动(非产业)
      - 旧闻
      - 重复报道
      - 资金面纯炒作
    weight: 0.5

# ============================================================
# 六、负向过滤（与镍版一致：纯噪音/无关/旧闻不引用）
# ============================================================
negative_filters:
  - 纯政治事件（与锌供需无关）
  - 与锌无关的商品（如纯原油/黄金独立行情）
  - 个股非产业异动
  - 1周前的旧闻（除非被新事件激活）
  - 重复/洗稿报道
  - 纯技术面/资金面（无基本面支撑）

# ============================================================
# 七、刷新与评价
# ============================================================
refresh:
  scorer: scorer_v2_zn.py
  cadence: 与 data.json 同步（每30min）
  ranking: 20套Prompt评分排名（问财 vs 本地AI 对比）
